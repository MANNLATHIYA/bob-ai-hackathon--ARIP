[project]
name = "clinical-trial-risk-monitor"
version = "1.0.0"
description = "Synthetic clinical-trial protocol deviation detection and site risk monitoring demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3", "python-multipart>=0.0.9",
  "httpx>=0.27,<1", "reportlab>=4.2,<5", "python-docx>=1.1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
