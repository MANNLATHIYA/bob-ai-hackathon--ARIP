submission:
  title: Clinical Trial Risk Monitor & Protocol Deviation Detector
  problem_statement: >-
    Clinical Risk Managers, CRAs, and Sponsor QA teams need to detect protocol
    deviations across thousands of visits and hundreds of sites before late
    discovery compromises participant safety, data integrity, and trial timelines.
  solution_summary: >-
    TrialSutra compares synthetic visit records against a machine-readable
    protocol, classifies deviations, ranks site risk with transparent weights,
    and generates draft CAPA reports for qualified human review.
  key_features:
    - Deterministic visit-window, dosing, route, medication, and assessment checks
    - Optional OpenAI-compatible or Anthropic review of clinical notes
    - Site risk ranking and trend dashboard across 200 synthetic sites
    - Draft CAPA reports exported as Markdown, PDF, or DOCX
    - Reproducible synthetic dataset with 1000 participants and 5000 visits
  tech_stack:
    languages: [Python, TypeScript]
    frameworks: [FastAPI, React, Tailwind CSS, Recharts]
    ibm_technologies: []
    databases: [SQLite]
    other: [Docker, GitHub Actions]
  known_limitations: >-
    Synthetic data only. LLM findings and CAPA drafts require human review.
    No live EHR or CTMS integration, production authentication, or GxP validation.
